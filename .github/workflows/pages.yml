name: Publicar site no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar arquivos públicos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html styles.css sobre-nos.css app.js config.js \
            simulador-consorcio.html simulador.css simulador.js tabelas-consorcio.js \
            simulador-imoveis.html privacidade.html privacidade.css privacidade.js \
            nunito.ttf open-sans-400.woff2 open-sans-700.woff2 \
            logo-doutor.jpeg hero-auto.jpg consorcio-vida.jpg \
            simulador-veiculos.jpg sobre-nos-familia.jpg _site/
          touch _site/.nojekyll
      - name: Enviar arquivos da publicação
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
